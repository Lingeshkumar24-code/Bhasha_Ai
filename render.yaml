services:
  - type: web
    name: bhashavoice-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: https://bhashavoice-frontend.onrender.com
      - key: CONTEXT_WINDOW_TURNS
        value: "6"

  - type: web
    name: bhashavoice-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://bhashavoice-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
