services:
  - type: web
    name: bhashavoice-ai
    env: python
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "*"
      - key: CONTEXT_WINDOW_TURNS
        value: "6"
      - key: PYTHON_VERSION
        value: 3.12.0
